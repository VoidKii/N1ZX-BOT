<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BFC — Blox Fruits Community</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e0e0e0;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 600px;
        }

        .logo {
            font-size: 3.5rem;
            margin-bottom: 20px;
            display: inline-block;
            background: linear-gradient(135deg, #5865f2 0%, #7c8cff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: bold;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
            color: #ffffff;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #b0b0b0;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .description {
            font-size: 1rem;
            color: #a0a0a0;
            margin-bottom: 40px;
            line-height: 1.6;
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 12px;
            border-left: 3px solid #5865f2;
        }

        .login-button {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #5865f2 0%, #7c8cff 100%);
            color: white;
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4);
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.6);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button svg {
            width: 20px;
            height: 20px;
        }

        .footer {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            color: #808080;
        }

        .footer p {
            margin: 0;
        }

        @media (max-width: 600px) {
            .logo {
                font-size: 2.5rem;
            }

            h1 {
                font-size: 1.8rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .description {
                font-size: 0.95rem;
                padding: 15px;
            }

            .login-button {
                padding: 12px 24px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🏴‍☠️</div>
        <h1>BFC</h1>
        <p class="subtitle">Blox Fruits Community</p>

        <p class="description">
            An all-in-one dashboard for managing your Blox Fruits Community server. Moderate members, send announcements, manage giveaways, and more — all in one place.
        </p>

        <a href="{{ login_url }}" class="login-button">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.211.375-.444.864-.607 1.25a18.27 18.27 0 0 0-5.487 0c-.163-.386-.395-.875-.607-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028a14.975 14.975 0 0 0 1.293-2.1a.07.07 0 0 0-.038-.098a13.11 13.11 0 0 1-1.872-.892a.072.072 0 0 1-.009-.119c.125-.093.25-.19.371-.287a.075.075 0 0 1 .078-.01c3.928 1.793 8.18 1.793 12.062 0a.075.075 0 0 1 .079.009c.12.098.246.195.371.288a.072.072 0 0 1-.01.119c-.598.35-1.22.645-1.872.892a.07.07 0 0 0-.038.098c.335.68.72 1.345 1.293 2.1a.074.074 0 0 0 .084.028a19.868 19.868 0 0 0 6.002-3.03a.072.072 0 0 0 .032-.057c.44-4.6.285-9.1-.476-13.55a.075.075 0 0 0-.035-.031zM8.02 15.278c-1.167 0-2.126-1.066-2.126-2.36c0-1.294.948-2.36 2.126-2.36c1.178 0 2.127 1.066 2.126 2.36c0 1.294-.948 2.36-2.126 2.36zm7.974 0c-1.166 0-2.126-1.066-2.126-2.36c0-1.294.948-2.36 2.126-2.36c1.178 0 2.126 1.066 2.126 2.36c0 1.294-.948 2.36-2.126 2.36z"/>
            </svg>
            Continue with Discord
        </a>

        <div class="footer">
            <p>Made by Anaisha Sharma</p>
        </div>
    </div>
</body>
</html>
